[project]
name = "adi-gpt"
version = "0.1.0"
description = "A private, local personal assistant: FastAPI + Ollama + SQLite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30",
  "httpx>=0.27,<1",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
  "pypdf>=5",
  "python-docx>=1.1",
  "trafilatura>=2",
  "ddgs>=9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "ruff>=0.6"]

[project.scripts]
adi-gpt = "adigpt.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["adigpt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "ASYNC"]
ignore = ["B008", "B905", "UP031", "ASYNC240"]
